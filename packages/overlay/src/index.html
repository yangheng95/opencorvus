    <style>
      .oc-startup-surface {
        align-items: center;
        background: #f4f4f4;
        color: #1d1d1f;
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
        font:
          500 14px/1.4 Inter,
          "Segoe UI",
          sans-serif;
        gap: 14px;
        justify-content: center;
        min-height: 100%;
      }

      .oc-startup-surface__mark {
        align-items: center;
        background: #ffffff;
        border: 1px solid rgba(29, 29, 31, 0.1);
        border-radius: 14px;
        box-shadow: 0 8px 24px rgba(29, 29, 31, 0.08);
        display: flex;
        height: 52px;
        justify-content: center;
        width: 52px;
      }

      .oc-startup-surface__mark img {
        height: 28px;
        width: 28px;
      }

      .oc-startup-surface__status {
        color: #6e6e73;
        letter-spacing: 0.01em;
        margin: 0;
      }

      .oc-startup-surface__progress {
        appearance: none;
        background: rgba(29, 29, 31, 0.12);
        border: 0;
        border-radius: 999px;
        height: 6px;
        overflow: hidden;
        width: min(320px, calc(100vw - 64px));
      }

      .oc-startup-surface__progress::-webkit-progress-bar {
        background: transparent;
      }
      .oc-startup-surface__progress::-webkit-progress-value,
      .oc-startup-surface__progress::-moz-progress-bar {
        background: #1d1d1f;
        border-radius: inherit;
      }

      .oc-startup-surface__detail {
        color: #86868b;
        font-size: 12px;
        margin: 0;
      }

      .oc-startup-surface__actions {
        display: flex;
        gap: 8px;
      }

      .oc-startup-surface__action {
        background: #1d1d1f;
        border: 0;
        border-radius: 8px;
        color: #fff;
        cursor: pointer;
        font: inherit;
        padding: 8px 12px;
      }

      .oc-startup-surface__action--secondary {
        background: rgba(29, 29, 31, 0.1);
        color: #1d1d1f;
      }
    </style>

  <body data-page="overlay">
    <div id="overlayAppHost">
      <main class="oc-startup-surface" aria-busy="true" aria-label="OpenCorvus is loading">
        <div class="oc-startup-surface__mark" aria-hidden="true">
          <img src="./opencorvus-logo-light.svg" alt="" />
        </div>
        <p class="oc-startup-surface__status" id="oc-startup-status">Preparing OpenCorvus</p>
        <progress class="oc-startup-surface__progress" id="oc-startup-progress" max="100" value="0">0%</progress>
        <p class="oc-startup-surface__detail" id="oc-startup-detail">0%</p>
        <div class="oc-startup-surface__actions" id="oc-startup-actions" hidden>
          <button class="oc-startup-surface__action" id="oc-startup-retry" type="button">Retry</button>
          <button
            class="oc-startup-surface__action oc-startup-surface__action--secondary"
            id="oc-startup-log"
            type="button"
          >
            View log
          </button>
        </div>
      </main>
    </div>
    <script type="module">
      await (async () => {
        const eventName = "overlay:startup-progress"
        const status = document.getElementById("oc-startup-status")
        const progress = document.getElementById("oc-startup-progress")
        const detail = document.getElementById("oc-startup-detail")
        const actions = document.getElementById("oc-startup-actions")
        const retry = document.getElementById("oc-startup-retry")
        const log = document.getElementById("oc-startup-log")
        let logPath = ""
        let applicationReady = false
        let resolveApplicationReady
        window.__opencorvusStartupReady = new Promise((resolve) => {
          resolveApplicationReady = resolve
        })

        const loadApplication = () => {
          if (applicationReady) return
          applicationReady = true
          resolveApplicationReady()
        }
        const tauri = window.__TAURI__
        if (!tauri) {
          loadApplication()
          return
        }
        const invoke = (command, args) => tauri.core.invoke(command, args)
        const update = ({ payload }) => {
          const value = payload || {}
          const total = Number(value.totalBytes) || 0
          const completed = Math.min(Number(value.completedBytes) || 0, total)
          const percent = total > 0 ? Math.round((completed / total) * 100) : 0
          status.textContent = value.message || "Preparing OpenCorvus"
          progress.value = percent
          detail.textContent = `${percent}%`
          logPath = typeof value.logPath === "string" ? value.logPath : ""
          const failed = value.phase === "failed"
          actions.hidden = !failed
          log.hidden = !logPath
          if (value.phase === "ready") loadApplication()
        }

        retry.addEventListener("click", () => invoke("overlay_startup_retry"))
        log.addEventListener("click", () => invoke("overlay_startup_open_log", { path: logPath }))
        await tauri.event.listen(eventName, update)
      })()
    </script>
    <script type="module" src="/main.tsx"></script>
