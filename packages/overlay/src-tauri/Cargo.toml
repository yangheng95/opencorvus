[package]
name = "opencorvus-overlay"
version = "0.0.38-beta"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"

[features]
default = ["devtools"]
devtools = ["tauri/devtools"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
base64 = "0.22"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
flate2 = "1"
tar = "0.4"
fs4 = { version = "1.1", features = ["sync"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winrt-toast-reborn = "0.3.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"

[profile.release]
strip = true
lto = false
codegen-units = 1
opt-level = "s"
