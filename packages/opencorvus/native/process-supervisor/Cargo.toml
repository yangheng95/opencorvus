[package]
name = "opencorvus-process-supervisor"
version = "0.0.46-beta"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
