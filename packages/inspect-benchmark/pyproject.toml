[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencorvus-inspect"
version = "0.3.2"
description = "Extensible Inspect AI benchmark platform for the OpenCorvus Task API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSES/*", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "OpenCorvus contributors" }]
dependencies = [
  "httpx>=0.28,<1",
  "inspect-ai==0.3.259",
  "openai>=3.1,<4",
]

[project.optional-dependencies]
automation = [
  "automation-bench @ git+https://github.com/zapier/AutomationBench@4a8e1061254004d9dac807054eed33fad7d1ff14",
  "mcp==1.30.0",
  "json5==0.12.1",
  "uvicorn==0.53.0",
]
dev = [
  "mypy>=1.15,<2",
  "numpy>=1.26,<2.3",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[project.entry-points.inspect_ai]
opencorvus_inspect = "opencorvus_inspect._registry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opencorvus_inspect = ["examples/*.jsonl", "examples/*.json", "py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"src/opencorvus_inspect/benchmark/apodex.py" = ["E501"] # Exact attributed judge prompts.

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["opencorvus_inspect"]

[[tool.mypy.overrides]]
module = ["automationbench.*"]
ignore_missing_imports = true
