<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="share-title">
    <title id="share-title">TANK BATTLE · EXECUTION MAP</title>
    <rect width="1440" height="960" fill="#f7f9fd"/>
    <g font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
      <text x="72" y="70" fill="#253044" font-size="23" font-weight="600">OpenCorvus</text>
      <text x="72" y="170" fill="#253044" font-size="54" font-weight="700">Tank battle: from research to delivery</text>
      <text x="72" y="225" fill="#69778f" font-size="24">19 acceptance requirements · 35 stages of source data · two correction rounds</text>
      <text x="72" y="910" fill="#69778f" font-size="15">Recorded roles and repairs; illustrative workflow edges. Repair origins are not event attribution. Not the product interface or exact timing.</text>
    </g>
    <g transform="translate(75 280)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 590" width="1290" height="590" role="img" aria-labelledby="share-title share-desc">
    <title id="share-title">One goal. A coordinated effort.</title>
    <desc id="share-desc">Intent, requirements and research join at architecture, then branch into design and workload review. Implementation branches into testing and interface review. System and interface reviews join at delivery. Two amber repair edges return to implementation.</desc>
