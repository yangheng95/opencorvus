<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="veil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#020508" stop-opacity="0.99"/>
      <stop offset="0.55" stop-color="#040a0f" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#06120e" stop-opacity="0.87"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <image href="__BACKGROUND__" width="1920" height="1080" preserveAspectRatio="xMidYMid slice" opacity="0.24"/>
  <rect width="1920" height="1080" fill="url(#veil)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(86 72)">
      <image href="__LOGO__" width="112" height="112"/>
      <text x="138" y="54" fill="#f3f7fa" font-size="42" font-weight="760">OpenCorvus</text>
      <text x="140" y="88" fill="#6fcfe1" font-size="15" font-weight="800" letter-spacing="2.7">MISSION · LONG-HORIZON DELIVERY</text>
    </g>

    <g transform="translate(90 286)">
      <text x="0" y="0" fill="#91aab5" font-size="20" font-weight="750" letter-spacing="2">DON'T JUST ASK FOR AN ANSWER</text>
      <text x="0" y="78" fill="#ffffff" font-size="58" font-weight="770">别只让 Agent 回答。</text>
      <text x="0" y="150" fill="#67dfab" font-size="58" font-weight="770">让它把结果交出来。</text>
      <path d="M0 205 H640" stroke="#24424c" stroke-width="2"/>
      <text x="0" y="256" fill="#a8bbc3" font-size="22" font-weight="620">大型软件工程 · 机器学习研发 · 数据治理</text>
      <text x="0" y="292" fill="#a8bbc3" font-size="22" font-weight="620">安全审计 · 系统迁移 · 合规交付</text>
    </g>

    <g transform="translate(1010 236)" filter="url(#shadow)">
      <rect width="824" height="638" rx="30" fill="#06100f" fill-opacity="0.9" stroke="#337e69" stroke-opacity="0.66"/>
      <text x="42" y="60" fill="#62d59f" font-size="17" font-weight="820" letter-spacing="2">OPEN SOURCE · VERIFIED LINKS</text>

      <text x="42" y="124" fill="#819ba6" font-size="17" font-weight="760">WEBSITE</text>
      <text x="42" y="160" fill="#f0f8fb" font-size="25" font-weight="660">https://opencorvus.com</text>
      <line x1="42" y1="190" x2="782" y2="190" stroke="#1f3a38"/>

      <text x="42" y="244" fill="#819ba6" font-size="17" font-weight="760">OPENCORVUS PROJECT</text>
      <text x="42" y="280" fill="#f0f8fb" font-size="25" font-weight="660">github.com/yangheng95/opencorvus</text>
      <line x1="42" y1="310" x2="782" y2="310" stroke="#1f3a38"/>

      <text x="42" y="364" fill="#819ba6" font-size="17" font-weight="760">DEBERTA ABSA CASE REPOSITORY</text>
      <text x="42" y="400" fill="#eafff5" font-size="23" font-weight="680">github.com/yangheng95/</text>
      <text x="42" y="433" fill="#eafff5" font-size="23" font-weight="680">deberta-v3-absa-public-evidence</text>
      <line x1="42" y1="466" x2="782" y2="466" stroke="#1f3a38"/>

      <text x="42" y="520" fill="#819ba6" font-size="17" font-weight="760">AUTHOR</text>
      <text x="42" y="558" fill="#f0f8fb" font-size="25" font-weight="680">Heng Yang · @yangheng95</text>
      <text x="42" y="606" fill="#6a8e82" font-size="16" font-weight="650">OpenCorvus project · MIT License</text>
    </g>

    <text x="90" y="1012" fill="#58727e" font-size="16" font-weight="650" letter-spacing="1.3">MISSION CASE · 6 TASKS · 46 AGENT SESSIONS · 12 H 45 MIN</text>
  </g>
