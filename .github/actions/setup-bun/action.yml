name: "Setup Bun"
description: "Setup Bun with caching and optional dependency install"
inputs:
  install_dependencies:
    description: "Run the repository dependency install step."
    required: false
    default: "true"
  prepare_compile_runtimes:
    description: "Stage the exact native Bun compile runtimes declared by packageManager."
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 22

    - name: Cache Bun dependencies
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Get baseline download URL
      id: bun-url
      shell: bash
      run: |
        if [ "$RUNNER_ARCH" = "X64" ]; then
          V=$(node -p "require('./package.json').packageManager.split('@')[1]")
          case "$RUNNER_OS" in
            macOS)   OS=darwin ;;
            Linux)   OS=linux ;;
            Windows) OS=windows ;;
          esac
          echo "url=https://github.com/oven-sh/bun/releases/download/bun-v${V}/bun-${OS}-x64-baseline.zip" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Bun
      id: setup-bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: ${{ !steps.bun-url.outputs.url && 'package.json' || '' }}
        bun-download-url: ${{ steps.bun-url.outputs.url }}

    - name: Stage selected Bun compile runtime
      if: ${{ inputs.prepare_compile_runtimes == 'true' }}
      shell: bash
      env:
        BUN_SOURCE: ${{ steps.setup-bun.outputs.bun-path }}
        RUNTIME_ROOT: ${{ runner.temp }}/opencorvus-bun-runtimes
      run: |
        node - <<'NODE'
        const fs = require("node:fs")
        const path = require("node:path")
        const os = { macOS: "darwin", Linux: "linux", Windows: "windows" }[process.env.RUNNER_OS]
        const arch = process.env.RUNNER_ARCH === "ARM64" ? "aarch64" : "x64"
        const suffix = process.env.RUNNER_ARCH === "X64" ? "-baseline" : ""
        const directory = path.join(process.env.RUNTIME_ROOT, `bun-${os}-${arch}${suffix}`)
        fs.mkdirSync(directory, { recursive: true })
        fs.copyFileSync(process.env.BUN_SOURCE, path.join(directory, process.env.RUNNER_OS === "Windows" ? "bun.exe" : "bun"))
        NODE
        echo "OPENCORVUS_BUN_RUNTIME_DIR=$RUNTIME_ROOT" >> "$GITHUB_ENV"

    - name: Get native x64 download URL
      if: ${{ inputs.prepare_compile_runtimes == 'true' && runner.arch == 'X64' }}
      id: bun-native-url
      shell: bash
      run: |
        V=$(node -p "require('./package.json').packageManager.split('@')[1]")
        case "$RUNNER_OS" in
          macOS)   OS=darwin ;;
          Linux)   OS=linux ;;
          Windows) OS=windows ;;
        esac
        echo "url=https://github.com/oven-sh/bun/releases/download/bun-v${V}/bun-${OS}-x64.zip" >> "$GITHUB_OUTPUT"

    - name: Setup native x64 Bun compile runtime
      if: ${{ inputs.prepare_compile_runtimes == 'true' && runner.arch == 'X64' }}
      id: setup-bun-native
      uses: oven-sh/setup-bun@v2
      with:
        bun-download-url: ${{ steps.bun-native-url.outputs.url }}
        no-cache: true

    - name: Stage native x64 Bun compile runtime
      if: ${{ inputs.prepare_compile_runtimes == 'true' && runner.arch == 'X64' }}
      shell: bash
      env:
        BUN_SOURCE: ${{ steps.setup-bun-native.outputs.bun-path }}
        RUNTIME_ROOT: ${{ runner.temp }}/opencorvus-bun-runtimes
      run: |
        node - <<'NODE'
        const fs = require("node:fs")
        const path = require("node:path")
        const os = { macOS: "darwin", Linux: "linux", Windows: "windows" }[process.env.RUNNER_OS]
        const directory = path.join(process.env.RUNTIME_ROOT, `bun-${os}-x64`)
        fs.mkdirSync(directory, { recursive: true })
        fs.copyFileSync(process.env.BUN_SOURCE, path.join(directory, process.env.RUNNER_OS === "Windows" ? "bun.exe" : "bun"))
        NODE

    - name: Install dependencies
      if: ${{ inputs.install_dependencies == 'true' }}
      run: bun install --frozen-lockfile --no-progress --ignore-scripts
      shell: bash
      env:
        HUSKY: "0"
