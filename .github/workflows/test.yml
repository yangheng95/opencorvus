name: test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
jobs:
  version-sync:
    name: version-sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Verify opencorvus and overlay versions are aligned
        run: bun ./script/sync-version.ts --check

  unit:
    name: unit (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-latest
          - name: macos
            host: macos-latest
          - name: windows
            host: windows-latest
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencorvus.ai"
          git config --global user.name "opencorvus"

      - name: Run unit tests
        run: bunx turbo run test --filter=opencorvus

  build-critical:
    name: build-critical (linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run critical builds
        run: bun run --cwd packages/opencorvus build --single --skip-install

  channel-runtime-unit:
    name: channel-runtime-unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run channel runtime tests
        run: bun run --cwd packages/channel-runtime test

  overlay-unit:
    name: overlay-unit
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run overlay unit tests
        working-directory: packages/overlay
        run: bun run test

  project-open:
    name: project-open (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-latest
          - name: macos-arm64
            host: macos-latest
          - name: macos-x64
            host: macos-15-intel
          - name: windows
            host: windows-latest
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencorvus.ai"
          git config --global user.name "opencorvus"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            ripgrep

      - name: Install macOS runtime dependency
        if: runner.os == 'macOS'
        run: brew install ripgrep

      - name: Install Windows runtime dependency
        if: runner.os == 'Windows'
        run: choco install ripgrep --yes --no-progress

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/overlay/src-tauri -> target
            packages/opencorvus/native/process-supervisor -> target

      - name: Run project-open benchmark with inactivity timeout
        run: bun packages/opencorvus/script/benchmark/project-open.ts --idle-timeout-ms 600000

  required:
    name: test (linux)
    runs-on: ubuntu-latest
    needs:
      - version-sync
      - unit
      - build-critical
      - gui-coordinate-smoke
      - channel-runtime-unit
      - overlay-unit
      - overlay-browser
      - project-open
    if: always()
    steps:
      - name: Verify upstream test jobs passed
        run: |
          echo "version-sync=${{ needs['version-sync'].result }}"
          echo "unit=${{ needs.unit.result }}"
          echo "build-critical=${{ needs['build-critical'].result }}"
          echo "gui-coordinate-smoke=${{ needs['gui-coordinate-smoke'].result }}"
          echo "channel-runtime-unit=${{ needs['channel-runtime-unit'].result }}"
          echo "overlay-unit=${{ needs['overlay-unit'].result }}"
          echo "overlay-browser=${{ needs['overlay-browser'].result }}"
          echo "project-open=${{ needs['project-open'].result }}"
          test "${{ needs['version-sync'].result }}" = "success"
          test "${{ needs.unit.result }}" = "success"
          test "${{ needs['build-critical'].result }}" = "success"
          test "${{ needs['gui-coordinate-smoke'].result }}" = "success"
          test "${{ needs['channel-runtime-unit'].result }}" = "success"
          test "${{ needs['overlay-unit'].result }}" = "success"
          test "${{ needs['overlay-browser'].result }}" = "success"
          test "${{ needs['project-open'].result }}" = "success"
