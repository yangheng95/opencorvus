name: unit test
run-name: ${{ inputs.test_files != '' && 'Selected unit tests' || 'Complete unit tests' }}

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      test_files:
        description: "Optional newline-separated paths relative to packages/opencorvus; empty runs the complete suite"
        type: string
        required: false
        default: ""
jobs:
  unit:
    name: ${{ inputs.test_files != '' && 'selected unit' || 'unit' }} (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-latest
          - name: macos
            host: macos-latest
          - name: windows
            host: windows-latest
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencorvus.ai"
          git config --global user.name "opencorvus"

      - name: Install Linux test runtime dependencies
        if: runner.os == 'Linux'
        # Bounded for the same reason as the release build: a plain `-y`
        # does not stop a debconf prompt or the runner's unattended-upgrades
        # holding the apt lock, and either one hangs the job indefinitely.
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo bash script/install-ubuntu-packages.sh ripgrep

      - name: Install macOS test runtime dependencies
        if: runner.os == 'macOS'
        run: brew install ripgrep

      - name: Setup Windows Python test runtime
        if: runner.os == 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Windows test runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./script/install-windows-ripgrep.ps1
          bun packages/opencorvus/script/prepare-test-process-supervisor.ts

      - name: Run unit tests
        env:
          SELECTED_TEST_FILES: ${{ inputs.test_files || '' }}
        run: |
          SELECTED=()
          while IFS= read -r file || [[ -n "$file" ]]; do
            if [[ -n "$file" ]]; then SELECTED+=("$file"); fi
          done <<< "$SELECTED_TEST_FILES"
          bunx turbo run test --filter=opencorvus -- "${SELECTED[@]}"

  channel-runtime-unit:
    name: channel-runtime-unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          prepare_sdk: "true"

      - name: Run channel runtime tests
        run: bun run --cwd packages/channel-runtime test

  overlay-unit:
    name: overlay-unit
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          prepare_sdk: "true"

      - name: Run overlay unit tests
        working-directory: packages/overlay
        run: bun run test

  required:
    name: ${{ inputs.test_files != '' && 'selected test matrix' || 'test (linux)' }}
    runs-on: ubuntu-latest
    needs:
      - unit
      - channel-runtime-unit
      - overlay-unit
    if: always()
    steps:
      - name: Verify upstream test jobs passed
        run: |
          echo "unit=${{ needs.unit.result }}"
          echo "channel-runtime-unit=${{ needs['channel-runtime-unit'].result }}"
          echo "overlay-unit=${{ needs['overlay-unit'].result }}"
          test "${{ needs.unit.result }}" = "success"
          test "${{ needs['channel-runtime-unit'].result }}" = "success"
          test "${{ needs['overlay-unit'].result }}" = "success"
