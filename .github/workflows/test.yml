name: unit test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
jobs:
  unit:
    name: unit (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-latest
          - name: macos
            host: macos-latest
          - name: windows
            host: windows-latest
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencorvus.ai"
          git config --global user.name "opencorvus"

      - name: Install Linux test runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install macOS test runtime dependencies
        if: runner.os == 'macOS'
        run: brew install ripgrep

      - name: Install Windows test runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./script/install-windows-ripgrep.ps1
          bun packages/opencorvus/script/prepare-test-process-supervisor.ts

      - name: Run unit tests
        run: bunx turbo run test --filter=opencorvus

  channel-runtime-unit:
    name: channel-runtime-unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          prepare_sdk: "true"

      - name: Run channel runtime tests
        run: bun run --cwd packages/channel-runtime test

  overlay-unit:
    name: overlay-unit
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          prepare_sdk: "true"

      - name: Run overlay unit tests
        working-directory: packages/overlay
        run: bun run test

  required:
    name: test (linux)
    runs-on: ubuntu-latest
    needs:
      - unit
      - channel-runtime-unit
      - overlay-unit
    if: always()
    steps:
      - name: Verify upstream test jobs passed
        run: |
          echo "unit=${{ needs.unit.result }}"
          echo "channel-runtime-unit=${{ needs['channel-runtime-unit'].result }}"
          echo "overlay-unit=${{ needs['overlay-unit'].result }}"
          test "${{ needs.unit.result }}" = "success"
          test "${{ needs['channel-runtime-unit'].result }}" = "success"
          test "${{ needs['overlay-unit'].result }}" = "success"
