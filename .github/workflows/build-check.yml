name: build check

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  version-sync:
    name: version-sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Verify opencorvus and overlay versions are aligned
        run: bun ./script/sync-version.ts --check

  build-critical:
    name: build-critical (linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          prepare_sdk: "true"

      - name: Install critical build runtime dependencies
        # Bounded for the same reason as the release build: a plain `-y` does
        # not stop a debconf prompt or the runner's unattended-upgrades holding
        # the apt lock, and either one hangs the job indefinitely.
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo bash script/install-ubuntu-packages.sh ripgrep

      - name: Run critical builds
        run: bun run --cwd packages/opencorvus build --single --skip-install

      - name: Retain failed native first-run diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-native-first-run
          path: .scratch/package-runtime/tmp/opencorvus-first-run-*/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  required:
    name: build check (linux)
    runs-on: ubuntu-latest
    needs:
      - version-sync
      - build-critical
    if: always()
    steps:
      - name: Verify upstream build jobs passed
        run: |
          echo "version-sync=${{ needs['version-sync'].result }}"
          echo "build-critical=${{ needs['build-critical'].result }}"
          test "${{ needs['version-sync'].result }}" = "success"
          test "${{ needs['build-critical'].result }}" = "success"
