name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 0.0.1 or v0.0.1)."
        required: true

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      update-channel: ${{ steps.meta.outputs.update-channel }}
      source-sha: ${{ steps.meta.outputs.source-sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        with:
          install_dependencies: "false"

      - name: Resolve release version
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RAW_VERSION="${GITHUB_REF_NAME#v}"
          else
            RAW_VERSION="${{ inputs.version }}"
          fi
          # Everything downstream reads this as OPENCORVUS_VERSION, and packages/script rejects
          # anything that is not canonical SemVer. A `v0.0.48-beta` tag happened to be canonical
          # once the `v` came off, so only the dispatch path ever carried a compact `0.0.48beta`
          # through — and it failed in all ten packaging legs rather than in prepare. Normalize
          # here, where both paths meet, so the input forms this workflow documents all resolve.
          VERSION="$(bun -e 'import { normalizeReleaseVersion } from "./script/sync-version.ts"; console.log(normalizeReleaseVersion(Bun.argv.at(-1)))' "$RAW_VERSION")"
          PRERELEASE="$(bun -e 'import { releaseVersionMetadata } from "./script/sync-version.ts"; console.log(releaseVersionMetadata(Bun.argv.at(-1)).prerelease)' "$VERSION")"
          UPDATE_CHANNEL="$(bun -e 'import { desktopUpdateChannel } from "./script/desktop-update-channel.ts"; console.log(desktopUpdateChannel(Bun.argv.at(-1)))' "$VERSION")"
          SOURCE_SHA="$(git rev-parse 'HEAD^{commit}')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "update-channel=$UPDATE_CHANNEL" >> "$GITHUB_OUTPUT"
          echo "source-sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Sync repo versions
        shell: bash
        run: bun ./script/sync-version.ts "${{ steps.meta.outputs.version }}"

      - name: Verify version alignment
        shell: bash
        run: bun ./script/sync-version.ts "${{ steps.meta.outputs.version }}" --check

  package-overlay:
    name: overlay (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-latest
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Sync repo versions
        run: bun ./script/sync-version.ts "${{ needs.prepare.outputs.version }}"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        # A release build must not be able to wait forever here. Observed on
        # v0.0.47-beta: this step held `in_progress` for over an hour on
        # linux-x64 while linux-arm64 finished the same install, so the run
        # never reached Setup Rust and no Release could publish. apt blocks
        # indefinitely on two things a plain `-y` does not cover — a debconf
        # prompt, and the runner's own unattended-upgrades holding the lock —
        # so the frontend is pinned, the lock is waited on with a bound, and
        # the step fails instead of hanging.
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=5 -o Acquire::http::Timeout=20 update
          sudo apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=5 -o Acquire::http::Timeout=20 install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            ripgrep \
            xdg-utils
          rg --version
          # `xdg-utils` provides /usr/bin/xdg-open which Tauri's AppImage
          # bundler shells out to during `--bundles appimage`. Without it
          # the bundle step fails with "xdg-open binary not found
          # /usr/bin/xdg-open" after .deb and .rpm have already been
          # produced. ubuntu-latest happens to ship it preinstalled but
          # ubuntu-24.04-arm doesn't, so the linux-arm64 runner failed.

      - name: Install macOS overlay runtime dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ripgrep
          rg --version

      - name: Install Windows overlay runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./script/install-windows-ripgrep.ps1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/overlay/src-tauri -> target

      - name: Package GUI installers
        env:
          OPENCORVUS_VERSION: ${{ needs.prepare.outputs.version }}
          OPENCORVUS_CHANNEL: latest
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run package:gui-installer-matrix

      - name: Upload overlay artifact
        uses: actions/upload-artifact@v7
        with:
          name: overlay-${{ matrix.platform }}
          path: packages/overlay/dist-artifacts/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7

  # CLI means command-line interface; each row packages only its native host.
  package-cli:
    name: cli (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-latest
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        with:
          prepare_compile_runtimes: "true"

      - name: Sync repo versions
        run: bun ./script/sync-version.ts "${{ needs.prepare.outputs.version }}"

      - name: Install Linux CLI runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rg --version

      - name: Install macOS CLI runtime dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ripgrep
          rg --version

      - name: Install Windows CLI runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./script/install-windows-ripgrep.ps1

      - name: Setup Rust for the Windows process supervisor
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Windows process supervisor build
        if: runner.os == 'Windows'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/opencorvus/native/process-supervisor -> target

      - name: Package CLI archives
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          OPENCORVUS_VERSION: ${{ needs.prepare.outputs.version }}
          OPENCORVUS_CHANNEL: latest
        run: bun run package:binary-matrix

      - name: Verify packaged Work Artifact lifecycle
        run: |
          set -euo pipefail
          verified=0
          for bundle in \
            "packages/opencorvus/dist/opencorvus-${{ matrix.platform }}" \
            "packages/opencorvus/dist/opencorvus-${{ matrix.platform }}-baseline"; do
            if [[ ! -d "$bundle" ]]; then
              continue
            fi
            name="$(basename "$bundle")"
            evidence="packages/opencorvus/dist/work-artifact-qualification-${name}.json"
            bun packages/opencorvus/script/check-work-artifact-profile.ts \
              --profile office.presentation@1 \
              --package-root "$bundle" | tee "$evidence"
            verified=$((verified + 1))
          done
          test "$verified" -gt 0
          echo "Work Artifact packaged lifecycle passed for $verified ${{ matrix.platform }} bundle(s)." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.platform }}
          path: |
            packages/opencorvus/dist/opencorvus-${{ matrix.platform }}
            packages/opencorvus/dist/opencorvus-${{ matrix.platform }}.tar.gz
            packages/opencorvus/dist/opencorvus-${{ matrix.platform }}-baseline
            packages/opencorvus/dist/opencorvus-${{ matrix.platform }}-baseline.tar.gz
            packages/opencorvus/dist/work-artifact-qualification-opencorvus-${{ matrix.platform }}*.json
          if-no-files-found: error
          retention-days: 7

  publish-release-assets:
    name: publish release assets
    needs:
      - prepare
      - package-overlay
      - package-cli
    # One platform must not discard the others. A stalled apt mirror on a single
    # runner used to skip this job outright, throwing away nine finished builds
    # and leaving nothing to re-run against. Whatever built is staged onto the
    # draft Release; the draft is only published once the matrix is complete, so
    # a partial run costs a re-run of the one leg that failed rather than all of
    # them, and never ships a Release missing a platform.
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      complete: ${{ steps.completeness.outputs.complete }}
      missing: ${{ steps.completeness.outputs.missing }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        with:
          install_dependencies: "false"

      - uses: actions/download-artifact@v8
        with:
          path: /tmp/release-assets

      - name: Upload release assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source-sha }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          UPLOAD_DIR="$(mktemp -d)"
          bun ./script/stage-release-upload-assets.ts --source /tmp/release-assets --out "$UPLOAD_DIR" --version "$VERSION"
          cp LICENSE THIRD_PARTY_NOTICES.md "$UPLOAD_DIR/"
          PUBLISHED_AT="$(date -u -d "$(git show -s --format=%cI HEAD)" +%Y-%m-%dT%H:%M:%S.000Z)"
          bun ./script/generate-desktop-update-manifest.ts \
            --dir "$UPLOAD_DIR" \
            --out "$UPLOAD_DIR/latest.json" \
            --version "$VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --pub-date "$PUBLISHED_AT"
          (
            cd "$UPLOAD_DIR"
            sha256sum -- * > SHA256SUMS
          )
          mapfile -t FILES < <(find "$UPLOAD_DIR" -type f | sort)
          printf '%s\n' "${FILES[@]}"
          if ! gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # --target pins the tag to the commit prepare resolved, which is the tree these
            # binaries were actually built from. Without it `gh release create` tags whatever the
            # default branch points at when this step runs — an hour of packaging later — so any
            # merge during a release silently produced a tag that disagreed with the payload
            # `source_sha` the deploy carries, and the website's immutable-source guard refused a
            # Release whose binaries were fine. Observed on v0.0.48-beta.
            gh release create "v${VERSION}" \
              --draft \
              --target "$SOURCE_SHA" \
              --prerelease="${{ needs.prepare.outputs.prerelease }}" \
              --title "v${VERSION}" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload "v${VERSION}" "${FILES[@]}" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Report matrix completeness
        id: completeness
        env:
          OVERLAY_RESULT: ${{ needs.package-overlay.result }}
          CLI_RESULT: ${{ needs.package-cli.result }}
        run: |
          MISSING=()
          test "$OVERLAY_RESULT" = "success" || MISSING+=("overlay ($OVERLAY_RESULT)")
          test "$CLI_RESULT" = "success" || MISSING+=("cli ($CLI_RESULT)")
          if test "${#MISSING[@]}" -eq 0; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
            echo "missing=" >> "$GITHUB_OUTPUT"
            echo "Every platform built."
            exit 0
          fi
          JOINED="$(IFS=", "; echo "${MISSING[*]}")"
          echo "complete=false" >> "$GITHUB_OUTPUT"
          echo "missing=${JOINED}" >> "$GITHUB_OUTPUT"
          {
            echo "### Release v${{ needs.prepare.outputs.version }} publishes without every platform"
            echo
            echo "These matrix legs did not succeed:"
            for entry in "${MISSING[@]}"; do echo "- $entry"; done
            echo
            echo "The assets that did build are on the Release. Re-running a failed job adds its assets with --clobber."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: publish release
    needs:
      - prepare
      - publish-release-assets
    if: ${{ !cancelled() && needs.publish-release-assets.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A missing platform is a gap in the download table, not a reason to ship
      # nothing. The Release publishes with whatever built and says on its own
      # page which platforms are absent, so the ones that did build reach users
      # today and a later re-run fills the rest in with --clobber.
      - name: Record the platforms this Release is missing
        if: ${{ needs.publish-release-assets.outputs.complete != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          MISSING: ${{ needs.publish-release-assets.outputs.missing }}
        run: |
          echo "::warning::Release v${VERSION} publishes without: ${MISSING}"
          gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" --json body --jq .body > /tmp/release-body.md
          {
            cat <<NOTICE
          > **Incomplete platform coverage.** This release was published without: ${MISSING}.
          > Re-running the failed build job adds those assets to this same release.
          NOTICE
            echo
            cat /tmp/release-body.md
          } > /tmp/release-notes.md
          gh release edit "v${VERSION}" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/release-notes.md

      - name: Publish verified draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          UPDATE_CHANNEL: ${{ needs.prepare.outputs.update-channel }}
        run: |
          gh release edit "v${VERSION}" --draft=false --prerelease="${PRERELEASE}" --repo "$GITHUB_REPOSITORY"
          CHANNEL_TAG="desktop-update-${UPDATE_CHANNEL}"
          if ! gh release view "$CHANNEL_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$CHANNEL_TAG" \
              --prerelease \
              --title "OpenCorvus ${UPDATE_CHANNEL} desktop update channel" \
              --notes "Mutable signed desktop update metadata. Installers remain in immutable versioned releases." \
              --repo "$GITHUB_REPOSITORY"
          fi
          CHANNEL_DIR="$(mktemp -d)"
          gh release download "v${VERSION}" --pattern latest.json --dir "$CHANNEL_DIR" --repo "$GITHUB_REPOSITORY"
          gh release upload "$CHANNEL_TAG" "$CHANNEL_DIR/latest.json" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Dispatch public download page deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source-sha }}
        run: |
          TAG="v${VERSION}"
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type=opencorvus-release-published \
            -f "client_payload[version]=$VERSION" \
            -f "client_payload[tag]=$TAG" \
            -f "client_payload[source_sha]=$SOURCE_SHA"
