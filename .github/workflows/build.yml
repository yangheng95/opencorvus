name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 0.0.1 or v0.0.1)."
        required: true

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        with:
          install_dependencies: "false"

      - name: Resolve release version
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          fi
          PRERELEASE="$(bun -e 'import { releaseVersionMetadata } from "./script/sync-version.ts"; console.log(releaseVersionMetadata(Bun.argv.at(-1)).prerelease)' "$VERSION")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Sync repo versions
        shell: bash
        run: bun ./script/sync-version.ts "${{ steps.meta.outputs.version }}"

      - name: Verify version alignment
        shell: bash
        run: bun ./script/sync-version.ts "${{ steps.meta.outputs.version }}" --check

  package-overlay:
    name: overlay (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-latest
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Sync repo versions
        run: bun ./script/sync-version.ts "${{ needs.prepare.outputs.version }}"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            ripgrep \
            xdg-utils
          rg --version
          # `xdg-utils` provides /usr/bin/xdg-open which Tauri's AppImage
          # bundler shells out to during `--bundles appimage`. Without it
          # the bundle step fails with "xdg-open binary not found
          # /usr/bin/xdg-open" after .deb and .rpm have already been
          # produced. ubuntu-latest happens to ship it preinstalled but
          # ubuntu-24.04-arm doesn't, so the linux-arm64 runner failed.

      - name: Install macOS overlay runtime dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ripgrep
          rg --version

      - name: Install Windows overlay runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./script/install-windows-ripgrep.ps1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/overlay/src-tauri -> target

      - name: Package GUI installers
        env:
          OPENCORVUS_VERSION: ${{ needs.prepare.outputs.version }}
          OPENCORVUS_CHANNEL: latest
        run: bun run package:gui-installer-matrix

      - name: Upload overlay artifact
        uses: actions/upload-artifact@v7
        with:
          name: overlay-${{ matrix.platform }}
          path: packages/overlay/dist-artifacts/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7

  # CLI means command-line interface; each row packages only its native host.
  package-cli:
    name: cli (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-latest
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        with:
          prepare_compile_runtimes: "true"

      - name: Sync repo versions
        run: bun ./script/sync-version.ts "${{ needs.prepare.outputs.version }}"

      - name: Install Linux CLI runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rg --version

      - name: Install macOS CLI runtime dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ripgrep
          rg --version

      - name: Install Windows CLI runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./script/install-windows-ripgrep.ps1

      - name: Setup Rust for the Windows process supervisor
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Windows process supervisor build
        if: runner.os == 'Windows'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/opencorvus/native/process-supervisor -> target

      - name: Package CLI archives
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          OPENCORVUS_VERSION: ${{ needs.prepare.outputs.version }}
          OPENCORVUS_CHANNEL: latest
        run: bun run package:binary-matrix

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.platform }}
          path: |
            packages/opencorvus/dist/opencorvus-${{ matrix.platform }}
            packages/opencorvus/dist/opencorvus-${{ matrix.platform }}.tar.gz
            packages/opencorvus/dist/opencorvus-${{ matrix.platform }}-baseline
            packages/opencorvus/dist/opencorvus-${{ matrix.platform }}-baseline.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish-release-assets:
    name: publish release assets
    needs:
      - prepare
      - package-overlay
      - package-cli
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        with:
          install_dependencies: "false"

      - uses: actions/download-artifact@v8
        with:
          path: /tmp/release-assets

      - name: Upload release assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          UPLOAD_DIR="$(mktemp -d)"
          bun ./script/stage-release-upload-assets.ts --source /tmp/release-assets --out "$UPLOAD_DIR" --version "$VERSION"
          cp LICENSE THIRD_PARTY_NOTICES.md "$UPLOAD_DIR/"
          (
            cd "$UPLOAD_DIR"
            sha256sum -- * > SHA256SUMS
          )
          mapfile -t FILES < <(find "$UPLOAD_DIR" -type f | sort)
          printf '%s\n' "${FILES[@]}"
          if ! gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "v${VERSION}" \
              --draft \
              --prerelease="${{ needs.prepare.outputs.prerelease }}" \
              --title "v${VERSION}" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload "v${VERSION}" "${FILES[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  publish-release:
    name: publish release
    needs:
      - prepare
      - publish-release-assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish verified draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: gh release edit "v${VERSION}" --draft=false --prerelease="${PRERELEASE}" --repo "$GITHUB_REPOSITORY"
