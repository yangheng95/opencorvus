name: typecheck

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          prepare_sdk: "true"

      - name: Enforce SDK v2 imports
        run: bun run check:sdk-imports

      - name: Verify generated SDK and OpenAPI
        run: |
          bun ./script/generate.ts
          bun --cwd packages/opencorvus dev generate > /tmp/openapi.generated.json
          diff -u /tmp/openapi.generated.json packages/sdk/openapi.json
          bun ./script/generated-artifacts.ts --check-clean-worktree

      - name: Verify generated API docs
        run: bun run ./packages/opencorvus/script/docs/render-api-md.ts --check

      - name: Run typecheck
        run: bunx turbo run typecheck
