name: typecheck

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          prepare_sdk: "true"

      - name: Verify generated SDK and OpenAPI
        run: |
          bun ./script/generate.ts
          bun --cwd packages/opencorvus dev generate > /tmp/openapi.generated.json
          diff -u /tmp/openapi.generated.json packages/sdk/openapi.json
          bun ./script/generated-artifacts.ts --check-clean-worktree

      - name: Verify generated API docs
        run: bun run ./packages/opencorvus/script/docs/render-api-md.ts --check

      # The root `typecheck` script owns the list of checks. This step used to
      # restate part of that list — `check:sdk-imports` in its own step and
      # `turbo run typecheck` here — so `check:ai-runtime` and
      # `check:expert-squad-types` were in the script but never in CI, and the
      # tsconfig added to bring `expert-squads/**` under `tsc` was enforced
      # only on developer machines. One command, one list.
      - name: Run typecheck
        run: bun run typecheck
