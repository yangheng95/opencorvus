name: build-overlays

# Debug-only: invokes the same native packaging jobs without release mutation.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native installer platform or platform group to validate.
        type: choice
        default: all
        options:
          - all
          - linux
          - linux-x64
          - linux-arm64
          - darwin-x64
          - darwin-arm64
          - windows-x64

permissions:
  contents: read
  actions: read

jobs:
  select-platforms:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.selection.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          install_dependencies: "false"
      - id: selection
        env:
          OVERLAY_BUILD_PLATFORM: ${{ inputs.platform }}
        run: bun script/overlay-build-selection.ts >> "$GITHUB_OUTPUT"
  build-overlay:
    name: overlay (${{ matrix.platform }})
    needs: select-platforms
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-platforms.outputs.matrix) }}
    uses: ./.github/workflows/package-overlay.yml
    with:
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      retention-days: 3
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
