name: build-overlays

# Debug-only: invokes the same native packaging jobs without release mutation.
on:
  workflow_dispatch:
    inputs:
      linux_only:
        description: Validate only the split Linux x64 and ARM64 installer jobs.
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  build-overlay:
    name: overlay (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.linux_only && '[{"runner":"ubuntu-latest","platform":"linux-x64"},{"runner":"ubuntu-24.04-arm","platform":"linux-arm64"}]' || '[{"runner":"ubuntu-latest","platform":"linux-x64"},{"runner":"ubuntu-24.04-arm","platform":"linux-arm64"},{"runner":"macos-latest","platform":"darwin-arm64"},{"runner":"macos-15-intel","platform":"darwin-x64"},{"runner":"windows-latest","platform":"windows-x64"}]') }}
    uses: ./.github/workflows/package-overlay.yml
    with:
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      retention-days: 3
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
