name: build-overlays

# Manual debug workflow for overlay bundles only.
# Canonical release flow is .github/workflows/build.yml.
# This workflow still uses the bound overlay build script so the bundled
# opencorvus sidecar and overlay stay aligned.

on:
  workflow_dispatch:

jobs:
  build-overlay:
    name: overlay (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x64
            ext: ""
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            ext: ""
          - runner: macos-latest
            platform: darwin-arm64
            ext: ""
          - runner: macos-15-intel
            platform: darwin-x64
            ext: ""
          - runner: windows-latest
            platform: windows-x64
            ext: ".exe"

    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Sync repo versions
        run: bun ./script/sync-version.ts --check

      - name: Resolve repo version
        id: version
        shell: bash
        run: |
          VERSION="$(bun -e 'const pkg = await Bun.file("packages/opencorvus/package.json").json(); console.log(pkg.version)')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            ripgrep \
            xdg-utils

      - name: Install macOS runtime dependencies
        if: runner.os == 'macOS'
        run: brew install ripgrep

      - name: Install Windows runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./script/install-windows-ripgrep.ps1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/overlay/src-tauri -> target

      - name: Package GUI installers
        env:
          OPENCORVUS_VERSION: ${{ steps.version.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run package:gui-installer-matrix

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: overlay-${{ matrix.platform }}
          path: packages/overlay/dist-artifacts/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 3
